[project]
name = "goldenson-api"
version = "0.1.0"
description = "Backend API for GoldenSon"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "sqlalchemy>=2.0.52",
  "aiosqlite>=0.22.1",
  "alembic>=1.19.1",
  "greenlet>=3.5.5",
  "python-multipart>=0.0.32",
  "httpx>=0.28.1",
  "sqlite-vec>=0.1.9",
  "anyio>=4.9.0,<5.0.0",
]

[dependency-groups]
dev = [
  "ruff>=0.12.0,<1.0.0",
  "mypy>=1.17.0,<2.0.0",
  "pytest>=8.4.0,<9.0.0",
  "pytest-asyncio>=1.1.0,<2.0.0",
  "httpx>=0.28.0,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
pretty = true

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
